<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2B52F0">
<title>Calisthénie</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Mise en page : une colonne étroite façon carnet d'entraînement. Sélecteur de jour en haut, cartes d'exercices au milieu, minuteur de repos collé en bas. */
:root {
  --bg: #ECEEF1;
  --surface: #FFFFFF;
  --fg: #12161B;
  --muted: #5C6672;
  --line: #D5DAE0;
  --accent: #2B52F0;
  --accent-fg: #FFFFFF;
  --ok: #1F8A52;
  --accent-soft: #B9C6FA;
  --font-display: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1115; --surface: #171B21; --fg: #E8ECF1; --muted: #8E99A6;
    --line: #2A313A; --accent: #7B97FF; --accent-fg: #0E1115; --ok: #4CC38A; --accent-soft: #34416E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1115; --surface: #171B21; --fg: #E8ECF1; --muted: #8E99A6;
  --line: #2A313A; --accent: #7B97FF; --accent-fg: #0E1115; --ok: #4CC38A; --accent-soft: #34416E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: 16px 140px;
}
.app { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.08em; text-transform: uppercase; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 0.9rem; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: #C23B3B; }
:root[data-theme="dark"] .btn.danger { color: #FF8A8A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.danger { color: #FF8A8A; } }

.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.day b { font-family: var(--font-display); font-size: 1.15rem; line-height: 1; letter-spacing: 0.04em; }
.day small { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.day[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.day[aria-pressed="true"] small { color: var(--bg); opacity: 0.7; }
.day.today:not([aria-pressed="true"]) { border-color: var(--accent); }

.hero { display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; line-height: 0.95; margin: 0; text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance; }
.hero h1 span { color: var(--accent); }
.meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 40px; }
.bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width 0.25s; }
.daynote { margin: 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; font-size: 0.92rem; }

.list { display: flex; flex-direction: column; gap: 12px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ex.complete { border-color: var(--ok); }
.ex-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.ex h3 { margin: 0; font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; line-height: 1.05; text-wrap: balance; min-width: 0; }
.spec { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.spec em { font-style: normal; color: var(--muted); margin-left: 8px; }
.note { margin: 0; color: var(--muted); font-size: 0.88rem; }
.sets { display: flex; flex-wrap: wrap; gap: 8px; }
.set { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line); background: transparent; font-family: var(--font-mono); font-weight: 700; font-size: 1.05rem; }
.set[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.maxrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.maxrow input { width: 88px; }
.record { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); }
.record b { color: var(--fg); }

.rest { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 28px 16px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.rest h2 { margin: 0; font-family: var(--font-display); font-size: 2rem; text-transform: uppercase; }
.rest p { margin: 0; color: var(--muted); }

/* édition */
.edit-ex { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
input[type="text"], input[type="number"], textarea {
  width: 100%; font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-width: 0;
}
textarea { resize: vertical; min-height: 44px; }
.edit-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hint { margin: 0; font-size: 0.85rem; color: var(--muted); }

/* minuteur */
.timer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); }
.timer-in { max-width: 560px; margin-inline: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.timer-time { font-family: var(--font-mono); font-weight: 700; font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.timer-lbl { flex: 1; min-width: 100px; font-size: 0.85rem; opacity: 0.75; }
.timer.done { background: var(--ok); color: #fff; }
.timer button { background: transparent; border: 1px solid currentColor; border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: 0.85rem; opacity: 0.9; }
.timer-prog { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); width: 0; }

/* navigation et fin de séance */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.tabs button { border: 0; background: transparent; border-radius: 7px; padding: 9px 0; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.finish { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; }
.finish .wide { width: 100%; padding-block: 12px; }
.finish .logged { margin: 0; flex: 1; min-width: 140px; }
.finish .logged b { color: var(--ok); }
.finish .field { flex: 1; min-width: 120px; }

/* historique */
.histo { display: flex; flex-direction: column; gap: 12px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-mono); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.panel h2 { margin: 0 0 8px; font-family: var(--font-display); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.04em; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-family: var(--font-mono); font-size: 9.5px; }
.chart .ax.on { fill: var(--fg); font-weight: 700; }
.chart .bar { fill: var(--accent-soft); }
.chart .bar.on { fill: var(--accent); }
.chart .val { fill: var(--fg); font-family: var(--font-mono); font-size: 10px; font-weight: 700; }
.chart .hit { fill: transparent; cursor: pointer; }
.readout { margin: 8px 0 0; font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.recs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.recs li { display: flex; justify-content: space-between; gap: 12px; }
.mono { font-family: var(--font-mono); font-size: 0.85rem; white-space: nowrap; }
.month { margin: 8px 0 0; font-family: var(--font-display); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.sess { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.sess summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
.sess summary::-webkit-details-marker { display: none; }
.sess summary::after { content: '›'; margin-left: auto; color: var(--muted); font-size: 1.5rem; line-height: 1; transition: transform 0.15s; }
.sess[open] summary::after { transform: rotate(90deg); }
.dbox { width: 44px; flex: none; display: flex; flex-direction: column; align-items: center; }
.dbox b { font-family: var(--font-display); font-size: 1.9rem; line-height: 1; }
.dbox small { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.sinfo { display: flex; flex-direction: column; min-width: 0; }
.sinfo strong { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.1; }
.sinfo span { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sess-body { padding: 0 14px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.sess-body ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.sess-body li { display: flex; justify-content: space-between; gap: 12px; }
.sess-body li > span:first-child { min-width: 0; }
.backup > summary { cursor: pointer; font-weight: 600; }
.backup .col { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.backup textarea { min-height: 88px; font-family: var(--font-mono); font-size: 0.75rem; }


/* semaines, progression, ressenti, compte */
.top-r { display: flex; gap: 8px; align-items: center; }
.sync::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 7px; vertical-align: 1px; }
.sync.ok::before { background: var(--ok); }
.sync.busy::before { background: var(--accent); }
.sync.err::before { background: #C23B3B; }
.weeknav { display: flex; align-items: center; gap: 8px; }
.weeknav .lbl { flex: 1; text-align: center; font-weight: 600; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.weeknav .lbl small { display: block; font-weight: 500; font-size: 0.75rem; color: var(--muted); }
.weeknav .btn { min-width: 44px; }
.weeknav .btn[disabled] { opacity: 0.35; cursor: default; }
.day.logged { box-shadow: inset 0 -3px 0 var(--ok); }
.variant { font-size: 0.75rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.chg { margin: 0; font-size: 0.82rem; color: var(--muted); }
.chg b { font-family: var(--font-mono); font-weight: 700; }
.chg b.up { color: var(--ok); }
.chg b.down { color: #C23B3B; }
.lvl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border: 1px dashed var(--accent); border-radius: 8px; font-size: 0.9rem; }
.lvl p { margin: 0; flex: 1; min-width: 160px; }
.set.sel { box-shadow: 0 0 0 3px var(--accent-soft); }
.set.val { font-size: 0.95rem; }
.stepper { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg); border-radius: 10px; }
.stepper > span { font-size: 0.85rem; color: var(--muted); min-width: 56px; }
.stepper b { font-family: var(--font-mono); font-size: 1.35rem; min-width: 3.2ch; text-align: center; font-variant-numeric: tabular-nums; }
.stepper .sq { width: 44px; height: 44px; padding: 0; font-size: 1.3rem; }
.stepper .grow { flex: 1; }
.feels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
.feel { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600; font-size: 0.85rem; }
.feel span { font-size: 1.6rem; line-height: 1; }
.feel[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.finish h2 { margin: 0; width: 100%; font-family: var(--font-display); font-size: 1.3rem; text-transform: uppercase; }
.prog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.prog li { display: grid; grid-template-columns: minmax(0, 1fr) 64px auto; align-items: center; gap: 10px; }
.prog li > span:first-child { min-width: 0; }
.prog small { color: var(--muted); }
.spark { width: 64px; height: 22px; display: block; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.spark circle { fill: var(--accent); }
.auth { display: flex; flex-direction: column; gap: 10px; }
.auth input[type="email"], .auth input[type="password"] { width: 100%; font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
.check input { width: 20px; height: 20px; }
.err { color: #C23B3B; }
.panel .check { margin: 10px 0; }
.panel .check + .hint { margin: 8px 0 12px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 8px 0; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.bodymap { width: 100%; height: auto; display: block; }
.bodymap .body-base { fill: var(--line); stroke: none; }
.bodymap .m-base { fill: var(--surface); stroke: var(--line); stroke-width: 0.8; }
.bodymap .m-heat { fill: var(--accent); stroke: none; pointer-events: none; }
.bodymap .m-hit { fill: transparent; stroke: none; cursor: pointer; }
.bodymap .m-hit.on { stroke: var(--fg); stroke-width: 1.6; }
.bodymap .ax { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; }
.legend { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 0.75rem; color: var(--muted); }
.legend i { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 20%, var(--surface)), var(--accent)); border: 1px solid var(--line); }
.musc li { grid-template-columns: 112px minmax(0, 1fr) auto; }
.mbar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--accent); }

@media (max-width: 380px) {
  .hero h1 { font-size: 2.2rem; }
  .edit-ex { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="app">
  <div class="top">
    <div class="brand">Calisthénie</div>
    <div class="top-r">
      <button class="btn sync" id="syncChip" type="button">Local</button>
      <button class="btn" id="editToggle" type="button">Modifier</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist">
    <button type="button" role="tab" data-view="seance" aria-selected="true">Séance</button>
    <button type="button" role="tab" data-view="histo" aria-selected="false">Historique</button>
    <button type="button" role="tab" data-view="muscles" aria-selected="false">Muscles</button>
  </div>
  <div class="weeknav" id="weeknav"></div>
  <div class="days" id="days" role="group" aria-label="Jour de la semaine"></div>
  <main id="main"></main>
</div>

<div class="timer" id="timer" hidden>
  <div class="timer-prog" id="timerProg"></div>
  <div class="timer-in">
    <div class="timer-time" id="timerTime">0:00</div>
    <div class="timer-lbl" id="timerLbl"></div>
    <button type="button" data-t="-15">−15 s</button>
    <button type="button" data-t="15">+15 s</button>
    <button type="button" data-t="skip">Passer</button>
  </div>
</div>

<script>
(function () {
  /* Config Firebase du projet « sporttraining-130bb ». Ces valeurs ne sont pas secrètes : la sécurité repose sur les
     règles Firestore (firestore.rules). Mets null pour n'utiliser l'app qu'en local. */
  var FIREBASE_CONFIG = {

    messagingSenderId: '1056851854748',

  };
  var FB_BASE = window.FIREBASE_SDK_BASE || 'https://www.gstatic.com/firebasejs/10.12.2/';

  var KEY = 'calisthenie.v2', OLD_KEY = 'calisthenie.v1', SYNC_KEY = 'calisthenie.sync';
  var DAY_SHORT = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  var DAY_LONG = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
  var FEELS = [
    { k: 'hard', emo: '😵', label: 'J’en ai chié' },
    { k: 'ok', emo: '👍', label: 'OK' },
    { k: 'easy', emo: '😎', label: 'Facile' }
  ];
  function feelOf(k) { for (var i = 0; i < FEELS.length; i++) if (FEELS[i].k === k) return FEELS[i]; return null; }

  /* Progression : kind = reps | time | sets (nombre de séries qui monte) | max | fixed (pas de progression).
     lo-hi = fourchette. On monte la cible de "step" chaque semaine réussie, puis on passe au niveau suivant. */
  function P(kind, lo, hi, next) { return { kind: kind, lo: lo, hi: hi, next: next || '' }; }
  function ex(id, name, sets, reps, rest, note, max, secs, prog) {
    var e = { id: id, name: name, sets: sets, reps: reps, rest: rest, note: note || '', max: !!max, secs: secs || 0 };
    if (max) e.kind = 'max';
    else if (prog) { e.kind = prog.kind; e.lo = prog.lo; e.hi = prog.hi; e.next = prog.next; e.step = stepFor(e); }
    else e.kind = 'fixed';
    return e;
  }
  function stepFor(e) { return e.kind === 'time' ? (e.hi - e.lo <= 5 ? 1 : 5) : 1; }
  function defaultProgram() {
    return [
      { focus: 'Push force', note: '', exercises: [
        ex('l1', 'Dips stricts', 4, '8-12', 120, 'Descente contrôlée, amplitude complète.', false, 0, P('reps', 8, 12, 'Tempo lent : 3 s à la descente')),
        ex('l2', 'Pompes déclinées', 4, '8-12', 120, 'Descente en 3 s.', false, 0, P('reps', 8, 12, 'Pieds plus haut')),
        ex('l3', 'Pike push-ups au sol', 3, '8-10', 120, 'Hanches au-dessus des épaules, tête entre les bras. Objectif : poirier mur propre.', false, 0, P('reps', 8, 10, 'Pieds sur une marche basse')),

    if (act === 'testSound') {
      warmAudio();
      if (prefs.bg) {
        try {
          if (!bgEl) { bgEl = new Audio(); bgEl.setAttribute('playsinline', ''); }
          if (bgUrl) URL.revokeObjectURL(bgUrl);
          bgUrl = URL.createObjectURL(buildWav(3, 0.4)); bgEl.src = bgUrl;
          var tp = bgEl.play(); if (tp && tp.catch) tp.catch(function () { beep('warn'); });
        } catch (e) { beep('warn'); }
      } else { beep('warn'); setTimeout(function () { beep('end'); }, 2500); }
      return;
    }
    if (act === 'signIn' || act === 'signUp') { authAction(act); return; }
    if (act === 'resetPw') { authAction(act); return; }
    if (act === 'signOut') { authAction(act); return; }
    if (act === 'syncNow') { if (cloud.user) pull(); return; }

    if (act === 'set') {
      warmAudio();
      var e = findEx(id); if (!e) return;
      var i = parseInt(b.getAttribute('data-i'), 10), t = tgt(e, mon);
      var lg = getLog(k, true), vals = lg.sets[id] || (lg.sets[id] = []);
      var showVal = isProg(e) && e.kind !== 'sets';
      if (vals.length >= i) {
        if (showVal) selSet = selSet && selSet.id === id && selSet.i === i ? null : { id: id, i: i };
        else { vals.length = i - 1; touchLog(lg); save(); }
        render(); return;
      }
      var fill = showVal ? t.t : 0;
      while (vals.length < i) vals.push(fill);
      selSet = null;
      if (!lg.startedAt) lg.startedAt = Date.now();
      touchLog(lg);
      var rs = parseInt(e.rest, 10) || 0;
      if (rs) startTimer(rs, e.name); else stopTimer();
      save(); render(); return;
    }
    if (act === 'inc' || act === 'dec') {
      var se = findEx(id), sl = getLog(k, false);
      if (!se || !sl || !selSet) return;
      var sv = sl.sets[id];
      sv[selSet.i - 1] = Math.max(0, sv[selSet.i - 1] + (act === 'inc' ? 1 : -1) * (se.step || 1));
      touchLog(sl); save(); render(); return;
    }
    if (act === 'undo') {
      var ul = getLog(k, false);
      if (ul && selSet) { ul.sets[id].length = selSet.i - 1; touchLog(ul); save(); }
      selSet = null; render(); return;
    }
    if (act === 'selClose') { selSet = null; render(); return; }
    if (act === 'saveMax') {
      warmAudio();
      var inp = document.getElementById('max-' + id), v = inp ? parseInt(inp.value, 10) : NaN;
      if (isNaN(v) || v < 0) { if (inp) inp.focus(); return; }
      if (!state.records[id] || v > state.records[id]) { state.records[id] = v; touchMain(); }
      var ml = getLog(k, true);
      ml.max[id] = v; touchLog(ml);
      stopTimer(); save(); render(); return;
    }
    if (act === 'levelUp') {
      var le = findEx(id), w = state.weeks[CUR_MON];
      if (!le || !w) return;
      le.level = (le.level || 1) + 1; le.variant = le.next; le.next = '';
      var lt = w.targets[id] || (w.targets[id] = baseTarget(le));
      lt.t = le.lo; lt.ready = false; lt.hard = 0; if (le.kind === 'sets') lt.sets = lt.t;
      w.manual = true;
      touchMain(); touchWeek(CUR_MON); save(); render(); return;
    }
    if (act === 'add' || act === 'addMax') {
      var nid = newId();
      d.exercises.push(act === 'add' ? enrich(Object.assign(ex(nid, 'Nouvel exercice', 3, '8-12', 90, ''), { kind: null })) : ex(nid, 'Finisher : pompes max', 1, 'max', 0, '', true));
      touchMain(); save(); render();
      var f = document.getElementById('n-' + nid); if (f) { f.focus(); f.select(); }
      return;
    }
    if (act === 'del') { d.exercises = d.exercises.filter(function (x) { return x.id !== id; }); touchMain(); save(); render(); return; }
    if (act === 'up' || act === 'down') {
      var idx = d.exercises.findIndex(function (x) { return x.id === id; }), to = act === 'up' ? idx - 1 : idx + 1;
      if (idx < 0 || to < 0 || to >= d.exercises.length) return;
      var tmp = d.exercises[idx]; d.exercises[idx] = d.exercises[to]; d.exercises[to] = tmp;
      touchMain(); save(); render(); return;
    }
    if (act === 'reset') { confirmReset = true; render(); return; }
    if (act === 'resetNo') { confirmReset = false; render(); return; }
    if (act === 'resetYes') { state.program = defaultProgram(); confirmReset = false; touchMain(); save(); render(); return; }
  });

  mainEl.addEventListener('change', function (ev) {
    var t = ev.target, df = t.getAttribute('data-day-field');
    var pf = t.getAttribute('data-pref');
    if (pf) { prefs[pf] = t.checked; savePrefs(); return; }
    if (df) { state.program[sel][df] = t.value; touchMain(); save(); return; }
    var id = t.getAttribute('data-id'), field = t.getAttribute('data-field');
    if (!id || !field) return;
    var e = findEx(id); if (!e) return;
    var w = state.weeks[CUR_MON];
    function curT() { if (!w.targets[id]) w.targets[id] = baseTarget(e); return w.targets[id]; }
    if (field === 'sets') {
      var n = parseInt(t.value, 10); e.sets = isNaN(n) || n < 1 ? 1 : n; t.value = e.sets;
      if (w && e.kind !== 'sets') { curT().sets = e.sets; touchWeek(CUR_MON); }
    } else if (field === 'rest') { var r = parseInt(t.value, 10); e.rest = isNaN(r) || r < 0 ? 0 : r; t.value = e.rest; }
    else if (field === 'target') {
      var g = parseInt(t.value, 10); if (isNaN(g) || g < 0) { render(); return; }
      if (w) { var ct = curT(); ct.t = g; if (e.kind === 'sets') ct.sets = g; ct.ready = isProg(e) && g >= e.hi && ct.ready; w.manual = true; touchWeek(CUR_MON); }
    } else if (field === 'reps' || field === 'auto') {
      if (field === 'reps') e.reps = t.value; else e.noProg = !t.checked;
      if (field === 'auto' && t.checked && e.kind === 'fixed') delete e.noProg;
      parseProg(e);
      if (w && isProg(e)) { var pt = curT(); pt.t = pt.t == null ? e.lo : Math.max(e.lo, Math.min(e.hi, pt.t)); if (e.kind === 'sets') pt.sets = pt.t; touchWeek(CUR_MON); }
      touchMain(); save(); render(); return;
    } else { e[field] = t.value; }
    touchMain(); save();
  });

  document.getElementById('tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-view]');
    if (!b) return;
    view = b.getAttribute('data-view');
    finishOpen = false; delAsk = ''; selSet = null; editing = false;
    render();
  });
  mainEl.addEventListener('toggle', function (ev) {
    var t = ev.target;
    if (!t.matches || !t.matches('details.sess')) return;
    var dt = t.getAttribute('data-date');
    if (t.open) openDate = dt; else if (openDate === dt) openDate = '';
  }, true);

  /* Changement de jour ou de semaine pendant que l'app reste ouverte. */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    var nk = key(new Date());
    if (nk !== todayKey) {
      todayKey = nk; CUR_MON = mondayKey(new Date()); todayIdx = dayIdxOf(nk);
      if (weekOff === 0) sel = todayIdx;
      if (ensureWeeks()) save();
      render();
    }
    if (cloud.user && Date.now() - cloud.lastPull > 30000) pull();
  });

  /* ---------- synchro Firebase ---------- */
  var cloud = { status: FIREBASE_CONFIG ? 'loading' : 'off', user: null, err: '', fb: null, lastPush: 0, lastPull: 0, timer: null, busy: false, again: false };
  try { cloud.lastPush = +localStorage.getItem(SYNC_KEY) || 0; } catch (e) {}
  function clean(o) { return JSON.parse(JSON.stringify(o)); }
  function setStatus(s, err) { cloud.status = s; cloud.err = err || ''; renderChip(); if (view === 'compte') render(); }
  function schedulePush() {
    if (!cloud.user) return;
    clearTimeout(cloud.timer);
    cloud.timer = setTimeout(push, 1200);
  }
  function rootRef() { return cloud.fb.F.doc(cloud.fb.db, 'users', cloud.user.uid); }
  function push() {
    if (!cloud.user || !cloud.fb) return Promise.resolve();
    if (cloud.busy) { cloud.again = true; return Promise.resolve(); }
    var F = cloud.fb.F, root = rootRef(), since = cloud.lastPush, started = Date.now(), ops = [];
    if (!since || (state.meta.updatedAt || 0) > since) ops.push([root, { v: 2, program: state.program, records: state.records, updatedAt: state.meta.updatedAt || started }]);
    Object.keys(state.logs).forEach(function (k) { if ((state.logs[k].updatedAt || 0) > since || !since) ops.push([F.doc(root, 'logs', k), state.logs[k]]); });
    Object.keys(state.weeks).forEach(function (k) { if ((state.weeks[k].updatedAt || 0) > since || !since) ops.push([F.doc(root, 'weeks', k), state.weeks[k]]); });
    if (!ops.length) { setStatus('ok'); return Promise.resolve(); }
    cloud.busy = true; setStatus('syncing');
    var chain = Promise.resolve();
    for (var i = 0; i < ops.length; i += 400) {
      (function (part) {
        chain = chain.then(function () { var bt = F.writeBatch(cloud.fb.db); part.forEach(function (op) { bt.set(op[0], clean(op[1])); }); return bt.commit(); });
      })(ops.slice(i, i + 400));
    }
    return chain.then(function () {
      cloud.lastPush = started;
      try { localStorage.setItem(SYNC_KEY, String(started)); } catch (e) {}
      cloud.busy = false; setStatus('ok');
      if (cloud.again) { cloud.again = false; return push(); }
    }, function (e) { cloud.busy = false; setStatus('error', 'Envoi impossible : ' + (e && e.code || e)); });
  }
  function pull() {
    if (!cloud.user || !cloud.fb) return Promise.resolve();
    var F = cloud.fb.F, root = rootRef();
    cloud.lastPull = Date.now(); setStatus('syncing');
    return Promise.all([F.getDoc(root), F.getDocs(F.collection(root, 'logs')), F.getDocs(F.collection(root, 'weeks'))]).then(function (r) {
      var main = r[0].exists() ? r[0].data() : null;
      if (!main) cloud.lastPush = 0;
      else {
        if ((main.updatedAt || 0) > (state.meta.updatedAt || 0) && Array.isArray(main.program) && main.program.length === 7) {
          state.program = cloneProgram(main.program); state.meta.updatedAt = migrated ? Date.now() : main.updatedAt; migrated = false;
        }
        var rr = main.records || {};
        Object.keys(rr).forEach(function (k) { if (!(state.records[k] >= rr[k])) state.records[k] = rr[k]; });
      }
      r[1].forEach(function (s) { var x = s.data(), l = state.logs[s.id]; if (!l || (x.updatedAt || 0) > (l.updatedAt || 0)) state.logs[s.id] = x; });
      r[2].forEach(function (s) { var x = s.data(), w = state.weeks[s.id]; if (!w || (x.updatedAt || 0) > (w.updatedAt || 0)) state.weeks[s.id] = x; });
      ensureWeeks(); saveLocal(); render();
      return push();
    }).catch(function (e) { setStatus('error', 'Synchro impossible : ' + (e && e.code || e)); });
  }
  var AUTH_ERR = {
    'auth/invalid-credential': 'E-mail ou mot de passe incorrect.',
    'auth/wrong-password': 'E-mail ou mot de passe incorrect.',
    'auth/user-not-found': 'Aucun compte avec cet e-mail. Utilise « Créer un compte ».',
    'auth/email-already-in-use': 'Ce compte existe déjà. Utilise « Se connecter ».',
    'auth/weak-password': 'Mot de passe trop court (6 caractères minimum).',
    'auth/invalid-email': 'E-mail invalide.',
    'auth/missing-password': 'Entre un mot de passe.',
    'auth/network-request-failed': 'Pas de réseau.',
    'auth/too-many-requests': 'Trop d’essais. Réessaie dans quelques minutes.',
    'auth/admin-restricted-operation': 'Les inscriptions sont fermées sur ce projet. Crée le compte dans la console Firebase (Authentication → Utilisateurs → Ajouter un utilisateur), puis connecte-toi.',
    'auth/operation-not-allowed': 'La connexion par e-mail n’est pas activée dans Firebase (Authentication → Sign-in method).'
  };
  function authAction(act) {
    if (!cloud.fb) return;
    var Au = cloud.fb.Au, auth = cloud.fb.auth;
    var mail = (document.getElementById('au-mail') || {}).value, pw = (document.getElementById('au-pw') || {}).value;
    var p;
    if (act === 'signIn') p = Au.signInWithEmailAndPassword(auth, mail, pw);
    else if (act === 'signUp') p = Au.createUserWithEmailAndPassword(auth, mail, pw);
    else if (act === 'resetPw') { if (!mail) { authMsg = 'Entre ton e-mail, puis touche « Mot de passe oublié ».'; render(); return; } p = Au.sendPasswordResetEmail(auth, mail).then(function () { authMsg = 'E-mail de réinitialisation envoyé.'; }); }
    else if (act === 'signOut') { p = Au.signOut(auth).then(function () { cloud.lastPush = 0; try { localStorage.removeItem(SYNC_KEY); } catch (e) {} authMsg = 'Déconnecté. Tes données restent sur cet appareil.'; }); }
    authBusy = true; authMsg = ''; render();
    p.then(function () { authBusy = false; render(); }, function (e) { authBusy = false; authMsg = AUTH_ERR[e && e.code] || ('Erreur : ' + (e && (e.code || e.message))); render(); });
  }
  function cloudInit() {
    if (!FIREBASE_CONFIG) return;
    Promise.all([import(FB_BASE + 'firebase-app.js'), import(FB_BASE + 'firebase-auth.js'), import(FB_BASE + 'firebase-firestore.js')]).then(function (m) {
      var A = m[0], Au = m[1], F = m[2];
      var app = A.initializeApp(FIREBASE_CONFIG), db;
      try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }), experimentalAutoDetectLongPolling: true }); } catch (e) { db = F.getFirestore(app); }
      if (window.FIREBASE_EMULATOR) {
        Au.connectAuthEmulator(Au.getAuth(app), 'http://' + window.FIREBASE_EMULATOR.auth, { disableWarnings: true });
        F.connectFirestoreEmulator(db, window.FIREBASE_EMULATOR.host, window.FIREBASE_EMULATOR.port);
      }
      cloud.fb = { Au: Au, F: F, auth: Au.getAuth(app), db: db };
      Au.onAuthStateChanged(cloud.fb.auth, function (u) {
        cloud.user = u;
        if (u) { authMsg = ''; pull(); } else setStatus('signedout');
      });
    }).catch(function () { setStatus('error', 'Impossible de charger Firebase (hors ligne ?). L’app marche quand même en local.'); });
  }
  window.__calisthenie = { state: function () { return state; }, bg: function () { return bgEl ? { src: bgEl.src, paused: bgEl.paused, viaAudio: !!(timer && timer.viaAudio) } : null; }, buildWav: buildWav, computeWeek: computeWeek, ensureWeeks: ensureWeeks, setFirebaseConfig: function (c) { FIREBASE_CONFIG = c; cloud.status = 'loading'; cloudInit(); render(); } };

  if (ensureWeeks()) saveLocal();
  saveLocal();
  render();
  cloudInit();
})();
</script>
