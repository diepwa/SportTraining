<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2B52F0">
<title>Calisthénie</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Mise en page : une colonne étroite façon carnet d'entraînement. Sélecteur de jour en haut, cartes d'exercices au milieu, minuteur de repos collé en bas. */
:root {
  --bg: #ECEEF1;
  --surface: #FFFFFF;
  --fg: #12161B;
  --muted: #5C6672;
  --line: #D5DAE0;
  --accent: #2B52F0;
  --accent-fg: #FFFFFF;
  --ok: #1F8A52;
  --accent-soft: #B9C6FA;
  --font-display: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1115; --surface: #171B21; --fg: #E8ECF1; --muted: #8E99A6;
    --line: #2A313A; --accent: #7B97FF; --accent-fg: #0E1115; --ok: #4CC38A; --accent-soft: #34416E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1115; --surface: #171B21; --fg: #E8ECF1; --muted: #8E99A6;
  --line: #2A313A; --accent: #7B97FF; --accent-fg: #0E1115; --ok: #4CC38A; --accent-soft: #34416E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: 16px 140px;
}
.app { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.08em; text-transform: uppercase; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 0.9rem; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: #C23B3B; }
:root[data-theme="dark"] .btn.danger { color: #FF8A8A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.danger { color: #FF8A8A; } }

.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.day b { font-family: var(--font-display); font-size: 1.15rem; line-height: 1; letter-spacing: 0.04em; }
.day small { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.day[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.day[aria-pressed="true"] small { color: var(--bg); opacity: 0.7; }
.day.today:not([aria-pressed="true"]) { border-color: var(--accent); }

.hero { display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; line-height: 0.95; margin: 0; text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance; }
.hero h1 span { color: var(--accent); }
.meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 40px; }
.bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width 0.25s; }
.daynote { margin: 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; font-size: 0.92rem; }

.list { display: flex; flex-direction: column; gap: 12px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ex.complete { border-color: var(--ok); }
.ex-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.ex h3 { margin: 0; font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; line-height: 1.05; text-wrap: balance; min-width: 0; }
.spec { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.spec em { font-style: normal; color: var(--muted); margin-left: 8px; }
.note { margin: 0; color: var(--muted); font-size: 0.88rem; }
.sets { display: flex; flex-wrap: wrap; gap: 8px; }
.set { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line); background: transparent; font-family: var(--font-mono); font-weight: 700; font-size: 1.05rem; }
.set[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.maxrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.maxrow input { width: 88px; }
.record { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); }
.record b { color: var(--fg); }

.rest { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 28px 16px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.rest h2 { margin: 0; font-family: var(--font-display); font-size: 2rem; text-transform: uppercase; }
.rest p { margin: 0; color: var(--muted); }

/* édition */
.edit-ex { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
input[type="text"], input[type="number"], textarea {
  width: 100%; font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-width: 0;
}
textarea { resize: vertical; min-height: 44px; }
.edit-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hint { margin: 0; font-size: 0.85rem; color: var(--muted); }

/* minuteur */
.timer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); }
.timer-in { max-width: 560px; margin-inline: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.timer-time { font-family: var(--font-mono); font-weight: 700; font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.timer-lbl { flex: 1; min-width: 100px; font-size: 0.85rem; opacity: 0.75; }
.timer.done { background: var(--ok); color: #fff; }
.timer button { background: transparent; border: 1px solid currentColor; border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: 0.85rem; opacity: 0.9; }
.timer-prog { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); width: 0; }

/* navigation et fin de séance */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.tabs button { border: 0; background: transparent; border-radius: 7px; padding: 9px 0; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.finish { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; }
.finish .wide { width: 100%; padding-block: 12px; }
.finish .logged { margin: 0; flex: 1; min-width: 140px; }
.finish .logged b { color: var(--ok); }
.finish .field { flex: 1; min-width: 120px; }

/* historique */
.histo { display: flex; flex-direction: column; gap: 12px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-mono); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.panel h2 { margin: 0 0 8px; font-family: var(--font-display); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.04em; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-family: var(--font-mono); font-size: 9.5px; }
.chart .ax.on { fill: var(--fg); font-weight: 700; }
.chart .bar { fill: var(--accent-soft); }
.chart .bar.on { fill: var(--accent); }
.chart .val { fill: var(--fg); font-family: var(--font-mono); font-size: 10px; font-weight: 700; }
.chart .hit { fill: transparent; cursor: pointer; }
.readout { margin: 8px 0 0; font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.recs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.recs li { display: flex; justify-content: space-between; gap: 12px; }
.mono { font-family: var(--font-mono); font-size: 0.85rem; white-space: nowrap; }
.month { margin: 8px 0 0; font-family: var(--font-display); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.sess { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.sess summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
.sess summary::-webkit-details-marker { display: none; }
.sess summary::after { content: '›'; margin-left: auto; color: var(--muted); font-size: 1.5rem; line-height: 1; transition: transform 0.15s; }
.sess[open] summary::after { transform: rotate(90deg); }
.dbox { width: 44px; flex: none; display: flex; flex-direction: column; align-items: center; }
.dbox b { font-family: var(--font-display); font-size: 1.9rem; line-height: 1; }
.dbox small { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.sinfo { display: flex; flex-direction: column; min-width: 0; }
.sinfo strong { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.1; }
.sinfo span { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sess-body { padding: 0 14px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.sess-body ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.sess-body li { display: flex; justify-content: space-between; gap: 12px; }
.sess-body li > span:first-child { min-width: 0; }
.backup > summary { cursor: pointer; font-weight: 600; }
.backup .col { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.backup textarea { min-height: 88px; font-family: var(--font-mono); font-size: 0.75rem; }

@media (max-width: 380px) {
  .hero h1 { font-size: 2.2rem; }
  .edit-ex { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="app">
  <div class="top">
    <div class="brand">Calisthénie</div>
    <button class="btn" id="editToggle" type="button">Modifier</button>
  </div>
  <div class="tabs" id="tabs" role="tablist">
    <button type="button" role="tab" data-view="seance" aria-selected="true">Séance</button>
    <button type="button" role="tab" data-view="histo" aria-selected="false">Historique</button>
  </div>
  <div class="days" id="days" role="group" aria-label="Jour de la semaine"></div>
  <main id="main"></main>
</div>

<div class="timer" id="timer" hidden>
  <div class="timer-prog" id="timerProg"></div>
  <div class="timer-in">
    <div class="timer-time" id="timerTime">0:00</div>
    <div class="timer-lbl" id="timerLbl"></div>
    <button type="button" data-t="-15">−15 s</button>
    <button type="button" data-t="15">+15 s</button>
    <button type="button" data-t="skip">Passer</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'calisthenie.v1';
  var DAY_SHORT = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  var DAY_LONG = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];

  function ex(id, name, sets, reps, rest, note, max) {
    return { id: id, name: name, sets: sets, reps: reps, rest: rest, note: note || '', max: !!max };
  }
  function defaultProgram() {
    return [
      { focus: 'Push force', note: '', exercises: [
        ex('l1', 'Dips stricts', 4, '8', 120, 'Objectif 4×12, puis tempo lent (3 s à la descente).'),
        ex('l2', 'Pompes archer', 4, '5 / côté', 120, 'Bras d’appui quasi tendu pour la suite.'),
        ex('l3', 'Pike push-ups pieds surélevés', 3, '6', 120, 'Objectif : poirier mur propre.'),
        ex('l4', 'Finisher : pompes max', 1, 'max', 0, 'Une seule série, jusqu’à l’échec technique.', true)
      ] },
      { focus: 'Pull force', note: 'Dans la journée : 5 à 6 séries de 3 tractions faciles, espacées d’au moins 1 h. Jamais à l’échec.', exercises: [
        ex('m1', 'Tractions strictes', 5, '4', 150, 'Objectif 5×6, puis descente en 3 s.'),
        ex('m2', 'Rowing australien pieds surélevés', 3, '8-10', 120, ''),
        ex('m3', 'Hollow body', 3, '30 s', 120, '')
      ] },
      { focus: 'Technique', note: 'Séries fraîches et propres. Jamais à l’échec.', exercises: [
        ex('w1', 'Poirier au mur', 5, '20-30 s', 75, ''),
        ex('w2', 'L-sit', 5, '8-10 s', 75, 'En tuck si besoin.'),
        ex('w3', 'Scapular pulls', 3, '8', 60, ''),
        ex('w4', 'Front lever tuck', 4, '5-8 s', 90, '')
      ] },
      { focus: 'Jambes + gainage', note: '', exercises: [
        ex('j1', 'Pistol squats assistés', 4, '5 / jambe', 90, ''),
        ex('j2', 'Fentes bulgares', 3, '8-10', 90, ''),
        ex('j3', 'Nordic curl négatifs', 3, '5', 90, ''),
        ex('j4', 'Planche', 3, '45 s', 60, '')
      ] },
      { focus: 'Full body', note: '', exercises: [
        ex('v1', 'Tractions strictes', 4, '4', 120, 'Max moins 2 répétitions.'),
        ex('v2', 'Dips stricts', 4, '8-10', 120, 'Max moins 2 répétitions.'),
        ex('v3', 'Pompes archer', 3, '6', 90, ''),
        ex('v4', 'Dragon flag négatifs', 3, '5', 90, ''),
        ex('v5', 'Finisher : pompes max', 1, 'max', 0, 'Une seule série, jusqu’à l’échec technique.', true)
      ] },
      { focus: 'Repos', note: 'Marche et mobilité. Récupération active.', exercises: [] },
      { focus: 'Repos', note: 'Repos complet.', exercises: [] }
    ];
  }

  var state = { program: defaultProgram(), done: {}, records: {}, sessions: [], starts: {}, maxReps: {} };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.program) && parsed.program.length === 7) {
        state.program = parsed.program;
        state.done = parsed.done || {};
        state.records = parsed.records || {};
        state.sessions = Array.isArray(parsed.sessions) ? parsed.sessions : [];
        state.starts = parsed.starts || {};
        state.maxReps = parsed.maxReps || {};
      }
    }
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var now = new Date();
  var todayIdx = (now.getDay() + 6) % 7;
  var sel = todayIdx;
  var editing = false;
  var confirmReset = false;
  var view = 'seance';
  var finishOpen = false;
  var selWeek = 7;
  var openDate = '';
  var delAsk = '';

  function dateKey(dayIdx) {
    var d = new Date();
    d.setDate(d.getDate() - todayIdx + dayIdx);
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var j = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + j;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function fmt(sec) {
    sec = Math.max(0, sec);
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
  function doneMap(dayIdx) {
    var k = dateKey(dayIdx);
    if (!state.done[k]) state.done[k] = {};
    return state.done[k];
  }
  function findEx(id) {
    var exs = state.program[sel].exercises;
    for (var i = 0; i < exs.length; i++) if (exs[i].id === id) return exs[i];
    return null;
  }
  function newId() { return 'x' + Date.now().toString(36) + Math.floor(Math.random() * 1000); }

  var daysEl = document.getElementById('days');
  var mainEl = document.getElementById('main');
  var editBtn = document.getElementById('editToggle');

  function renderDays() {
    var h = '';
    for (var i = 0; i < 7; i++) {
      var cls = 'day' + (i === todayIdx ? ' today' : '');
      h += '<button type="button" class="' + cls + '" data-day="' + i + '" aria-pressed="' + (i === sel) + '" aria-label="' + DAY_LONG[i] + '">' +
        '<b>' + DAY_SHORT[i].charAt(0) + '</b><small>' + DAY_SHORT[i] + '</small></button>';
    }
    daysEl.innerHTML = h;
  }

  function totals() {
    var d = state.program[sel], dm = doneMap(sel), total = 0, done = 0;
    d.exercises.forEach(function (e) {
      var n = e.max ? 1 : Math.max(0, parseInt(e.sets, 10) || 0);
      total += n;
      done += Math.min(n, dm[e.id] || 0);
    });
    return { total: total, done: done };
  }

  function minutesEstimate(d) {
    var sec = 0;
    d.exercises.forEach(function (e) {
      var n = e.max ? 1 : (parseInt(e.sets, 10) || 0);
      sec += n * (40 + (parseInt(e.rest, 10) || 0));
    });
    return Math.round(sec / 60);
  }

  function renderMain() {
    daysEl.hidden = view !== 'seance';
    editBtn.hidden = view !== 'seance';
    if (view === 'histo') { mainEl.innerHTML = renderHisto(); return; }
    var d = state.program[sel];
    var t = totals();
    var h = '<div class="hero"><h1>' + DAY_LONG[sel] + ' <span>' + esc(d.focus) + '</span></h1>';
    if (!editing && d.exercises.length) {
      h += '<div class="meta"><span>' + d.exercises.length + ' exos · environ ' + minutesEstimate(d) + ' min</span><div class="bar"><i style="width:' + (t.total ? Math.round(100 * t.done / t.total) : 0) + '%"></i></div><span>' + t.done + '/' + t.total + '</span></div>';
    }
    if (!editing && d.note) h += '<p class="daynote">' + esc(d.note) + '</p>';
    h += '</div>';

    if (editing) h += renderEdit(d); else h += renderView(d);
    mainEl.innerHTML = h;
    editBtn.textContent = editing ? 'Terminer' : 'Modifier';
    editBtn.className = 'btn' + (editing ? ' primary' : '');
  }

  function renderView(d) {
    if (!d.exercises.length) {
      return '<div class="rest"><h2>Jour de repos</h2><p>Rien au programme. Tu peux ajouter des exercices avec « Modifier ».</p></div>';
    }
    var dm = doneMap(sel);
    var h = '<div class="list">';
    d.exercises.forEach(function (e) {
      var n = e.max ? 1 : Math.max(1, parseInt(e.sets, 10) || 1);
      var got = Math.min(n, dm[e.id] || 0);
      h += '<article class="ex' + (got >= n ? ' complete' : '') + '">';
      h += '<div class="ex-head"><h3>' + esc(e.name) + '</h3><div class="spec">' +
        (e.max ? '1 × max' : n + ' × ' + esc(e.reps)) +
        (e.rest ? '<em>repos ' + fmt(parseInt(e.rest, 10) || 0) + '</em>' : '') + '</div></div>';
      if (e.note) h += '<p class="note">' + esc(e.note) + '</p>';
      if (e.max) {
        var rec = state.records[e.id];
        h += '<div class="maxrow"><input type="number" inputmode="numeric" min="0" id="max-' + esc(e.id) + '" placeholder="Reps" aria-label="Répétitions réalisées">' +
          '<button type="button" class="btn primary" data-act="saveMax" data-id="' + esc(e.id) + '">Enregistrer</button>' +
          '<span class="record">Record : <b>' + (rec ? rec : '—') + '</b></span></div>';
      } else {
        h += '<div class="sets">';
        for (var i = 1; i <= n; i++) {
          h += '<button type="button" class="set" data-act="set" data-id="' + esc(e.id) + '" data-i="' + i + '" aria-pressed="' + (i <= got) + '" aria-label="Série ' + i + '">' + i + '</button>';
        }
        h += '</div>';
      }
      h += '</article>';
    });
    h += '</div>';
    var k = dateKey(sel), logged = findSession(k), tt = totals();
    if (logged || tt.done > 0) {
      h += '<section class="finish">';
      if (finishOpen) {
        var defMin = logged ? logged.minutes : (state.starts[k] ? Math.min(180, Math.max(1, Math.round((Date.now() - state.starts[k]) / 60000))) : minutesEstimate(d));
        h += '<div class="field"><label for="fin-min">Durée (min)</label><input type="number" inputmode="numeric" min="1" id="fin-min" value="' + defMin + '"></div>' +
          '<div class="edit-actions"><button type="button" class="btn primary" data-act="finishSave">Enregistrer</button><button type="button" class="btn" data-act="finishCancel">Annuler</button></div>';
      } else if (logged) {
        h += '<p class="logged"><b>Séance enregistrée</b> · ' + fmtMin(logged.minutes) + '</p><button type="button" class="btn" data-act="finishOpen">Mettre à jour</button>';
      } else {
        h += '<button type="button" class="btn primary wide" data-act="finishOpen">Terminer la séance</button>';
      }
      h += '</section>';
    }
    return h;
  }

  function findSession(k) {
    for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].date === k) return state.sessions[i];
    return null;
  }
  function pk(key) { var p = key.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmtMin(m) { m = Math.round(m || 0); return m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') : m + ' min'; }
  function fmtDate(key, opt) { return pk(key).toLocaleDateString('fr-FR', opt); }
  function stat(v, l) { return '<div class="stat"><b>' + v + '</b><span>' + l + '</span></div>'; }

  function renderHisto() {
    var list = state.sessions.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var totMin = 0, totSets = 0;
    list.forEach(function (s) { totMin += s.minutes || 0; totSets += s.sets || 0; });
    var wStart = dateKey(0), wEnd = dateKey(6);
    var weekN = list.filter(function (s) { return s.date >= wStart && s.date <= wEnd; }).length;
    var planned = state.program.filter(function (d) { return d.exercises.length; }).length;
    var h = '<div class="histo">';
    h += '<div class="stats">' + stat(list.length, 'Séances') + stat(weekN + ' / ' + planned, 'Cette semaine') + stat(fmtMin(totMin), 'Temps total') + stat(totSets, 'Séries') + '</div>';

    var weeks = [], w;
    for (w = 7; w >= 0; w--) {
      var a = dateKey(-7 * w), b = dateKey(-7 * w + 6), n = 0, sets = 0, min = 0;
      list.forEach(function (s) { if (s.date >= a && s.date <= b) { n++; sets += s.sets || 0; min += s.minutes || 0; } });
      weeks.push({ a: a, n: n, sets: sets, min: min });
    }
    var maxV = 0;
    weeks.forEach(function (x) { if (x.sets > maxV) maxV = x.sets; });
    var top = Math.max(20, Math.ceil(maxV / 10) * 10);
    var W = 320, H = 150, L = 28, R = 6, T = 16, B = 24, ph = H - T - B, slot = (W - L - R) / 8;
    function yy(v) { return T + ph * (1 - v / top); }
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Séries réalisées par semaine, 8 dernières semaines">';
    [0, top / 2, top].forEach(function (g) {
      svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy(g) + '" y2="' + yy(g) + '"/>' +
        '<text class="ax" x="' + (L - 6) + '" y="' + (yy(g) + 3) + '" text-anchor="end">' + g + '</text>';
    });
    weeks.forEach(function (x, i) {
      var cx = L + slot * i + slot / 2, bw = 16, bx = cx - bw / 2;
      var hh = ph * x.sets / top, by = T + ph - hh, on = i === selWeek;
      if (hh > 0) {
        var r = Math.min(4, hh);
        svg += '<path class="bar' + (on ? ' on' : '') + '" d="M' + bx + ',' + (by + hh) + ' V' + (by + r) + ' Q' + bx + ',' + by + ' ' + (bx + r) + ',' + by +
          ' H' + (bx + bw - r) + ' Q' + (bx + bw) + ',' + by + ' ' + (bx + bw) + ',' + (by + r) + ' V' + (by + hh) + ' Z"><title>' + x.sets + ' séries</title></path>';
        if (on) svg += '<text class="val" x="' + cx + '" y="' + (by - 4) + '" text-anchor="middle">' + x.sets + '</text>';
      }
      svg += '<text class="ax' + (on ? ' on' : '') + '" x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + fmtDate(x.a, { day: '2-digit', month: '2-digit' }) + '</text>';
      svg += '<rect class="hit" data-act="wk" data-i="' + i + '" x="' + (L + slot * i) + '" y="' + T + '" width="' + slot + '" height="' + (ph + B) + '"/>';
    });
    svg += '</svg>';
    var sw = weeks[selWeek];
    h += '<section class="panel"><h2>Séries par semaine</h2>' + svg +
      '<p class="readout">Semaine du ' + fmtDate(sw.a, { day: 'numeric', month: 'long' }) + ' · ' + sw.n + ' séance' + (sw.n > 1 ? 's' : '') + ' · ' + sw.sets + ' séries · ' + fmtMin(sw.min) + '</p></section>';

    var recs = {};
    state.program.forEach(function (d) {
      d.exercises.forEach(function (e) {
        if (e.max && state.records[e.id] && (!recs[e.name] || state.records[e.id] > recs[e.name])) recs[e.name] = state.records[e.id];
      });
    });
    var rn = Object.keys(recs);
    if (rn.length) {
      h += '<section class="panel"><h2>Records</h2><ul class="recs">';
      rn.forEach(function (n) { h += '<li><span>' + esc(n) + '</span><span class="mono">' + recs[n] + ' reps</span></li>'; });
      h += '</ul></section>';
    }

    if (!list.length) {
      h += '<div class="rest"><h2>Aucune séance</h2><p>Termine ta première séance depuis l’onglet Séance. Elle apparaîtra ici.</p></div>';
    }
    var cur = '';
    list.forEach(function (s) {
      var mo = fmtDate(s.date, { month: 'long', year: 'numeric' });
      if (mo !== cur) { cur = mo; h += '<h2 class="month">' + mo + '</h2>'; }
      var dt = pk(s.date);
      h += '<details class="sess" data-date="' + s.date + '"' + (openDate === s.date ? ' open' : '') + '><summary>' +
        '<div class="dbox"><b>' + dt.getDate() + '</b><small>' + DAY_SHORT[(dt.getDay() + 6) % 7] + '</small></div>' +
        '<div class="sinfo"><strong>' + esc(s.focus) + '</strong><span>' + fmtMin(s.minutes) + ' · ' + s.sets + '/' + s.planned + ' séries · ' + s.exercises.length + ' exos</span></div></summary>' +
        '<div class="sess-body"><ul>';
      s.exercises.forEach(function (e) {
        h += '<li><span>' + esc(e.name) + '</span><span class="mono">' +
          (e.max ? (e.best != null ? e.best + ' reps' : '—') : e.done + '/' + e.sets + ' × ' + esc(e.reps)) + '</span></li>';
      });
      h += '</ul><div class="edit-actions">';
      if (delAsk === s.date) {
        h += '<span class="hint">Supprimer cette séance ?</span><button type="button" class="btn danger" data-act="delYes" data-id="' + s.date + '">Supprimer</button><button type="button" class="btn" data-act="delNo">Annuler</button>';
      } else {
        h += '<button type="button" class="btn danger" data-act="delAsk" data-id="' + s.date + '">Supprimer</button>';
      }
      h += '</div></div></details>';
    });

    var dump = JSON.stringify({ v: 1, program: state.program, sessions: state.sessions, records: state.records });
    h += '<details class="panel backup"><summary>Sauvegarde</summary><div class="col">' +
      '<p class="hint">Copie ce texte et garde-le quelque part. Il contient ton programme, ton historique et tes records.</p>' +
      '<textarea id="bk-out" readonly aria-label="Sauvegarde">' + esc(dump) + '</textarea>' +
      '<div class="edit-actions"><button type="button" class="btn" data-act="copy">Copier la sauvegarde</button></div>' +
      '<p class="hint">Pour restaurer sur un autre appareil, colle une sauvegarde ici. Elle remplace les données de cet appareil.</p>' +
      '<textarea id="bk-in" aria-label="Sauvegarde à importer" placeholder="Colle la sauvegarde"></textarea>' +
      '<div class="edit-actions"><button type="button" class="btn" data-act="import">Restaurer</button></div>' +
      '<p class="hint" id="bk-msg"></p></div></details>';
    h += '</div>';
    return h;
  }

  function renderEdit(d) {
    var h = '<div class="list">';
    h += '<div class="ex"><div class="field wide"><label for="f-focus">Titre de la séance</label><input type="text" id="f-focus" data-day-field="focus" value="' + esc(d.focus) + '"></div>' +
      '<div class="field wide"><label for="f-note">Note du jour</label><textarea id="f-note" data-day-field="note">' + esc(d.note) + '</textarea></div></div>';
    d.exercises.forEach(function (e) {
      var i = esc(e.id);
      h += '<div class="ex"><div class="edit-ex">' +
        '<div class="field wide"><label for="n-' + i + '">Exercice</label><input type="text" id="n-' + i + '" data-id="' + i + '" data-field="name" value="' + esc(e.name) + '"></div>' +
        '<div class="field"><label for="s-' + i + '">Séries</label><input type="number" inputmode="numeric" min="1" id="s-' + i + '" data-id="' + i + '" data-field="sets" value="' + esc(e.sets) + '"' + (e.max ? ' disabled' : '') + '></div>' +
        '<div class="field"><label for="r-' + i + '">Reps</label><input type="text" id="r-' + i + '" data-id="' + i + '" data-field="reps" value="' + esc(e.reps) + '"' + (e.max ? ' disabled' : '') + '></div>' +
        '<div class="field"><label for="t-' + i + '">Repos (s)</label><input type="number" inputmode="numeric" min="0" step="5" id="t-' + i + '" data-id="' + i + '" data-field="rest" value="' + esc(e.rest) + '"></div>' +
        '<div class="field wide"><label for="o-' + i + '">Note</label><input type="text" id="o-' + i + '" data-id="' + i + '" data-field="note" value="' + esc(e.note) + '"></div>' +
        '</div><div class="edit-actions">' +
        '<button type="button" class="btn" data-act="up" data-id="' + i + '">Monter</button>' +
        '<button type="button" class="btn" data-act="down" data-id="' + i + '">Descendre</button>' +
        '<button type="button" class="btn danger" data-act="del" data-id="' + i + '">Supprimer</button></div></div>';
    });
    h += '<div class="tools"><button type="button" class="btn primary" data-act="add">Ajouter un exercice</button>' +
      '<button type="button" class="btn" data-act="addMax">Ajouter un finisher max</button></div>';
    h += '<div class="tools">';
    if (confirmReset) {
      h += '<span class="hint">Tout le programme revient à la version de départ.</span><button type="button" class="btn danger" data-act="resetYes">Confirmer</button><button type="button" class="btn" data-act="resetNo">Annuler</button>';
    } else {
      h += '<button type="button" class="btn" data-act="reset">Réinitialiser le programme</button>';
    }
    h += '</div><p class="hint">Les modifications s’enregistrent toutes seules sur cet appareil. Reps accepte un nombre, une plage (8-10) ou un temps (30 s).</p></div>';
    return h;
  }

  /* minuteur */
  var timerEl = document.getElementById('timer');
  var timerTime = document.getElementById('timerTime');
  var timerLbl = document.getElementById('timerLbl');
  var timerProg = document.getElementById('timerProg');
  var timer = null, tickId = null, hideId = null, audio = null;

  function beep() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; g.gain.value = 0.15;
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.35);
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  function warmAudio() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) {}
  }
  function startTimer(sec, label) {
    if (!sec) return;
    clearTimeout(hideId);
    timer = { end: Date.now() + sec * 1000, total: sec, label: label, finished: false };
    timerEl.hidden = false;
    timerEl.classList.remove('done');
    timerLbl.textContent = 'Repos · ' + label;
    if (!tickId) tickId = setInterval(tick, 250);
    tick();
  }
  function stopTimer() {
    clearInterval(tickId); tickId = null; timer = null;
    clearTimeout(hideId);
    timerEl.hidden = true;
  }
  function tick() {
    if (!timer) return;
    var left = Math.ceil((timer.end - Date.now()) / 1000);
    if (left <= 0) {
      if (!timer.finished) {
        timer.finished = true;
        beep();
        timerEl.classList.add('done');
        timerTime.textContent = '0:00';
        timerLbl.textContent = 'C’est reparti';
        timerProg.style.width = '100%';
        clearInterval(tickId); tickId = null;
        hideId = setTimeout(stopTimer, 5000);
      }
      return;
    }
    timerTime.textContent = fmt(left);
    timerProg.style.width = Math.max(0, Math.min(100, 100 * (1 - left / timer.total))) + '%';
  }
  timerEl.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b || !timer) return;
    var a = b.getAttribute('data-t');
    if (a === 'skip') { stopTimer(); return; }
    var add = parseInt(a, 10) || 0;
    if (timer.finished) return;
    timer.end += add * 1000;
    timer.total = Math.max(1, timer.total + add);
    tick();
  });

  /* interactions */
  daysEl.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-day]');
    if (!b) return;
    sel = parseInt(b.getAttribute('data-day'), 10);
    confirmReset = false;
    renderDays(); renderMain();
  });
  editBtn.addEventListener('click', function () {
    editing = !editing; confirmReset = false;
    renderMain();
  });

  mainEl.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    var id = b.getAttribute('data-id');
    var d = state.program[sel];

    if (act === 'finishOpen') { finishOpen = true; renderMain(); return; }
    if (act === 'finishCancel') { finishOpen = false; renderMain(); return; }
    if (act === 'finishSave') {
      var fk = dateKey(sel), fin = document.getElementById('fin-min'), fm = parseInt(fin && fin.value, 10);
      if (isNaN(fm) || fm < 1) fm = 1;
      var fdm = doneMap(sel), ft = totals(), mr = state.maxReps[fk] || {};
      var sess = {
        date: fk, dayIdx: sel, focus: d.focus, minutes: fm, sets: ft.done, planned: ft.total,
        exercises: d.exercises.map(function (e) {
          var n = e.max ? 1 : Math.max(1, parseInt(e.sets, 10) || 1);
          return { name: e.name, sets: n, done: Math.min(n, fdm[e.id] || 0), reps: e.reps, max: !!e.max, best: e.max && mr[e.id] != null ? mr[e.id] : null };
        })
      };
      state.sessions = state.sessions.filter(function (x) { return x.date !== fk; });
      state.sessions.push(sess);
      finishOpen = false;
      stopTimer();
      save(); renderMain(); return;
    }
    if (act === 'wk') { selWeek = parseInt(b.getAttribute('data-i'), 10) || 0; renderMain(); return; }
    if (act === 'delAsk') { delAsk = id; openDate = id; renderMain(); return; }
    if (act === 'delNo') { delAsk = ''; renderMain(); return; }
    if (act === 'delYes') {
      state.sessions = state.sessions.filter(function (x) { return x.date !== id; });
      delAsk = ''; openDate = '';
      save(); renderMain(); return;
    }
    if (act === 'copy') {
      var ta = document.getElementById('bk-out'), msg = document.getElementById('bk-msg');
      ta.focus(); ta.select();
      var okMsg = function () { if (msg) msg.textContent = 'Sauvegarde copiée.'; };
      var koMsg = function () { if (msg) msg.textContent = 'Copie impossible ici. Le texte est sélectionné, copie-le à la main.'; };
      try { navigator.clipboard.writeText(ta.value).then(okMsg, koMsg); } catch (e) { koMsg(); }
      return;
    }
    if (act === 'import') {
      var imsg = document.getElementById('bk-msg');
      try {
        var o = JSON.parse(document.getElementById('bk-in').value);
        if (!o || !Array.isArray(o.sessions)) throw new Error('bad');
        state.sessions = o.sessions;
        if (o.records) state.records = o.records;
        if (Array.isArray(o.program) && o.program.length === 7) state.program = o.program;
        save(); renderMain();
        var m2 = document.getElementById('bk-msg'); if (m2) m2.textContent = 'Sauvegarde restaurée.';
      } catch (e) {
        if (imsg) imsg.textContent = 'Texte illisible. Colle la sauvegarde complète.';
      }
      return;
    }

    if (act === 'set') {
      warmAudio();
      var e = findEx(id); if (!e) return;
      var i = parseInt(b.getAttribute('data-i'), 10);
      var dm = doneMap(sel);
      var cur = dm[id] || 0;
      var wasLast = false;
      if (cur >= i) { dm[id] = i - 1; }
      else {
        dm[id] = i;
        var sk = dateKey(sel);
        if (!state.starts[sk]) state.starts[sk] = Date.now();
        var before = totals();
        wasLast = before.done >= before.total;
        if (!wasLast) startTimer(parseInt(e.rest, 10) || 0, e.name); else stopTimer();
      }
      save(); renderMain(); return;
    }
    if (act === 'saveMax') {
      warmAudio();
      var inp = document.getElementById('max-' + id);
      var v = inp ? parseInt(inp.value, 10) : NaN;
      if (isNaN(v) || v < 0) { if (inp) inp.focus(); return; }
      if (!state.records[id] || v > state.records[id]) state.records[id] = v;
      doneMap(sel)[id] = 1;
      var mk = dateKey(sel);
      if (!state.maxReps[mk]) state.maxReps[mk] = {};
      state.maxReps[mk][id] = v;
      var sk2 = dateKey(sel);
      if (!state.starts[sk2]) state.starts[sk2] = Date.now();
      stopTimer();
      save(); renderMain(); return;
    }
    if (act === 'add' || act === 'addMax') {
      var nid = newId();
      d.exercises.push(act === 'add' ? ex(nid, 'Nouvel exercice', 3, '8', 90, '') : ex(nid, 'Finisher : pompes max', 1, 'max', 0, '', true));
      save(); renderMain();
      var f = document.getElementById('n-' + nid); if (f) { f.focus(); f.select(); }
      return;
    }
    if (act === 'del') {
      d.exercises = d.exercises.filter(function (x) { return x.id !== id; });
      save(); renderMain(); return;
    }
    if (act === 'up' || act === 'down') {
      var idx = d.exercises.findIndex(function (x) { return x.id === id; });
      var to = act === 'up' ? idx - 1 : idx + 1;
      if (idx < 0 || to < 0 || to >= d.exercises.length) return;
      var tmp = d.exercises[idx]; d.exercises[idx] = d.exercises[to]; d.exercises[to] = tmp;
      save(); renderMain(); return;
    }
    if (act === 'reset') { confirmReset = true; renderMain(); return; }
    if (act === 'resetNo') { confirmReset = false; renderMain(); return; }
    if (act === 'resetYes') {
      state.program = defaultProgram(); confirmReset = false;
      save(); renderMain(); return;
    }
  });

  mainEl.addEventListener('change', function (ev) {
    var t = ev.target;
    var df = t.getAttribute('data-day-field');
    if (df) { state.program[sel][df] = t.value; save(); return; }
    var id = t.getAttribute('data-id'), field = t.getAttribute('data-field');
    if (!id || !field) return;
    var e = findEx(id); if (!e) return;
    if (field === 'sets') { var n = parseInt(t.value, 10); e.sets = isNaN(n) || n < 1 ? 1 : n; t.value = e.sets; }
    else if (field === 'rest') { var r = parseInt(t.value, 10); e.rest = isNaN(r) || r < 0 ? 0 : r; t.value = e.rest; }
    else { e[field] = t.value; }
    save();
  });

  document.getElementById('tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-view]');
    if (!b) return;
    view = b.getAttribute('data-view');
    finishOpen = false; delAsk = '';
    var tabs = document.querySelectorAll('#tabs [data-view]');
    for (var i = 0; i < tabs.length; i++) tabs[i].setAttribute('aria-selected', String(tabs[i] === b));
    renderMain();
  });
  mainEl.addEventListener('toggle', function (ev) {
    var t = ev.target;
    if (!t.matches || !t.matches('details.sess')) return;
    var dt = t.getAttribute('data-date');
    if (t.open) openDate = dt; else if (openDate === dt) openDate = '';
  }, true);

  renderDays();
  renderMain();
})();
</script>

</body>
